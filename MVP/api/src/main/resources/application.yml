server:
  port: ${PORT:8080}

spring:
  application:
    name: expense-tracker-api

  datasource:
    # Two pools — see ADR-0011 and DataSourceConfig.java.
    # `app` is the primary pool used by every authenticated endpoint. RLS is
    # enforced on this role; the RlsSessionAspect sets app.current_user_id.
    # `setup` is a dedicated pool for register / login / setupNewUser only.
    # The expense_setup role has BYPASSRLS — it must never reach any other
    # code path. Maximum pool size capped at 3 because only three low-frequency
    # methods use it.
    app:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
      username: ${DB_USERNAME}
      password: ${DB_APP_PASSWORD}
      # Forces every new pool connection to UTC, regardless of DB or role defaults.
      # Defence-in-depth — V16 also sets the DB-level default.
      connection-init-sql: "SET TIME ZONE 'UTC'"
    setup:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
      username: expense_setup
      password: ${DB_SETUP_PASSWORD}
      connection-init-sql: "SET TIME ZONE 'UTC'"
      maximum-pool-size: 3

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: false

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
    user: ${DB_SUPERUSER_USERNAME}
    password: ${DB_SUPERUSER_PASSWORD}
    placeholders:
      # Resolved at migration time. V20 uses these to set the expense_setup
      # role's password and grant CONNECT on the actual database, without
      # hardcoding either value into the migration file.
      db_setup_password: ${DB_SETUP_PASSWORD}
      db_name: ${DB_NAME:expense_db}

app:
  jwt:
    secret: ${JWT_SECRET}
    # Access tokens are stateless JWTs; refresh tokens are opaque + DB-tracked.
    # 15-minute access keeps the stolen-token window short; 7-day refresh
    # matches the v1.0 worst-case window so this is no worse on the slowest path.
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Swagger UI is the live demo layer — no frontend needed.
# Accessible at /swagger-ui.html once the app is running.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Structured JSON logging — every line is a valid JSON object.
# Makes logs grep-able and ready for a log aggregator later.
logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%level","logger":"%logger{36}","traceId":"%X{traceId:-}","msg":"%msg"}%n'
  level:
    root: INFO
    com.finance: DEBUG
