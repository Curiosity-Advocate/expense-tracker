plugins {
    id 'org.springframework.boot'
}

dependencies {
    // BOM import pins all Spring Boot dependency versions.
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.0')

    implementation project(':core')

    // Web + AOP + JPA + Validation + Security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Live Swagger UI — the demo layer since there is no frontend
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Health check endpoint for Render deployment
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // PostgreSQL driver + Flyway migrations
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT — api module only, core never touches JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
