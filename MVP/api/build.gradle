plugins {
    id 'org.springframework.boot'
}

dependencies {
    // BOM import pins all Spring Boot dependency versions.
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.0')

    // adapters brings :core transitively, plus JPA / Postgres / Flyway / security-crypto.
    implementation project(':adapters')

    // HTTP + AOP + Validation + Security live here because Spring (and Spring MVC
    // specifically) are taken as givens — they aren't candidates for swapping.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Live Swagger UI — the demo layer since there is no frontend
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Health check endpoint for Render deployment
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JWT — api module only, core never touches JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // v1.1 #1 — architecture rules enforcement
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // S1 — Testcontainers for integration tests against real Postgres.
    // Required so PoolIsolationIntegrationTest can exercise the actual role
    // permissions V20 introduces — RLS, BYPASSRLS, GRANT membership.
    testImplementation 'org.testcontainers:testcontainers:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
}
