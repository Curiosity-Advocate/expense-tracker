// Adapter implementations for swappable infrastructure: persistence (JPA entities,
// repositories, Postgres migrations) and the service impls that depend on them.
// Anything Spring-specific that is NOT obviously swappable (HTTP, security, config)
// stays in the api module — see docs/architecture for the rationale.
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.0')

    implementation project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
