spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
    # Worker uses superuser credentials so cleanup DELETEs bypass RLS policies.
    # App-role credentials would be blocked by the user_id-scoped RLS policies.
    username: ${DB_SUPERUSER_USERNAME}
    password: ${DB_SUPERUSER_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: false  # api module owns migrations

  # v1.1 #4 — outbound mail for JobFailureAlerter.
  # Defaults target MailHog (docker-compose service) so local dev never spams
  # a real inbox. Production overrides via env vars — see
  # docs/operations/scheduled-jobs.md for Gmail App Password setup.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

# v1.1 #4 — alerter config. Recipient defaults blank: the alerter no-ops if
# unset, so an unconfigured deploy logs a warning instead of crashing.
# Each tick retries the job up to max-attempts with exponential backoff
# (initial-backoff-ms, *2, *4, *8 ...). All attempts failing triggers an email.
alerts:
  job-failure:
    recipient: ${JOB_FAILURE_ALERT_RECIPIENT:}
    from: ${JOB_FAILURE_ALERT_FROM:noreply@expense-tracker.local}
    max-attempts: 5
    initial-backoff-ms: 30000

logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%level","logger":"%logger{36}","msg":"%msg"}%n'
  level:
    root: INFO
    com.finance: INFO
