server:
  port: ${PORT:8080}

spring:
  application:
    name: expense-tracker-api

  # B1 — Multipart limit for the CSV upload endpoint. Bank CSVs for a full
  # year are typically <500KB; 10MB is plenty of headroom and bounds the
  # damage from a runaway upload. Spring rejects oversized uploads early
  # (before the controller method runs) with MaxUploadSizeExceededException.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    # Two pools — see ADR-0011 and DataSourceConfig.java.
    # `app` is the primary pool used by every authenticated endpoint. RLS is
    # enforced on this role; the RlsSessionAspect sets app.current_user_id.
    # `setup` is a dedicated pool for register / login / setupNewUser only.
    # Under the Option-A pivot (see ADR-0011), it connects as the table-owner
    # role (= the role Flyway runs as). Postgres skips RLS for table owners,
    # giving the setup pool the bypass it needs without requiring BYPASSRLS
    # — which managed Postgres providers (Render, RDS, etc.) refuse to grant.
    # Maximum pool size capped at 3 because only three low-frequency methods use it.
    app:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
      username: ${DB_USERNAME}
      password: ${DB_APP_PASSWORD}
      # Forces every new pool connection to UTC, regardless of DB or role defaults.
      # Defence-in-depth — V16 also sets the DB-level default.
      connection-init-sql: "SET TIME ZONE 'UTC'"
    setup:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
      username: ${DB_SUPERUSER_USERNAME}
      password: ${DB_SUPERUSER_PASSWORD}
      connection-init-sql: "SET TIME ZONE 'UTC'"
      maximum-pool-size: 3

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: false

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_db}
    user: ${DB_SUPERUSER_USERNAME}
    password: ${DB_SUPERUSER_PASSWORD}
    placeholders:
      # Resolved at migration time. db_setup_password was used by V20 before
      # the Option-A pivot (ADR-0011) to set expense_setup's LOGIN password;
      # it is no longer referenced by any migration but is left declared
      # against ${DB_SETUP_PASSWORD:unused} for backward-compat with any
      # deployment that still has that env var set.
      db_setup_password: ${DB_SETUP_PASSWORD:unused}
      db_name: ${DB_NAME:expense_db}

app:
  jwt:
    secret: ${JWT_SECRET}
    # Access tokens are stateless JWTs; refresh tokens are opaque + DB-tracked.
    # 15-minute access keeps the stolen-token window short; 7-day refresh
    # matches the v1.0 worst-case window so this is no worse on the slowest path.
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

# B1.4 — Bank integration (CSV import) tuning. Defaults are sized for personal
# scale (10 users, weekly imports, <5000-row CSVs). See ADR-0020 for the
# async-with-startup-recovery model.
bank-integration:
  csv:
    # Rows per processor transaction. Smaller = smaller failure blast radius;
    # larger = fewer commits. 100 is comfortable at our row count.
    batch-size: 100
    # On API startup, csv_imports rows in PENDING or RUNNING with
    # submitted_at older than this are reset to PENDING and re-kicked-off.
    # 10 minutes is generous — even a 5000-row import shouldn't approach it.
    stale-running-threshold-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Swagger UI is the live demo layer — no frontend needed.
# Accessible at /swagger-ui.html once the app is running.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Structured JSON logging — every line is a valid JSON object.
# Makes logs grep-able and ready for a log aggregator later.
logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%level","logger":"%logger{36}","traceId":"%X{traceId:-}","msg":"%msg"}%n'
  level:
    root: INFO
    com.finance: DEBUG
